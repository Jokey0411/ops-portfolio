<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web 业务集群 - 节点状态</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Microsoft YaHei", sans-serif;
         background:#0f172a; color:#e2e8f0; display:flex; align-items:center;
         justify-content:center; min-height:100vh; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px;
          padding:32px 40px; max-width:680px; width:100%; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:24px; }
  .row { display:flex; justify-content:space-between; padding:10px 0;
         border-bottom:1px solid #334155; font-size:14px; }
  .row:last-child { border-bottom:none; }
  .k { color:#94a3b8; }
  .v { font-family: Consolas, monospace; color:#38bdf8; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px;
           font-size:12px; background:#065f46; color:#6ee7b7; }
  .badge.bad { background:#7f1d1d; color:#fca5a5; }
  button { margin-top:20px; background:#2563eb; color:#fff; border:none;
           padding:9px 18px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:hover { background:#1d4ed8; }
  pre { background:#0b1220; padding:12px; border-radius:6px; font-size:12px;
        overflow:auto; max-height:240px; color:#a5b4fc; }
</style>
</head>
<body>
<div class="card">
  <h1>Web 业务集群 · 节点状态</h1>
  <div class="sub">Nginx(负载均衡) → 2 × 节点(Nginx + Python App + MySQL)</div>

  <div class="row"><span class="k">当前响应节点</span><span class="v" id="node">加载中…</span></div>
  <div class="row"><span class="k">节点时间</span><span class="v" id="time">-</span></div>
  <div class="row"><span class="k">应用健康</span><span class="v" id="app">-</span></div>
  <div class="row"><span class="k">连接数据库</span><span class="v" id="db">-</span></div>
  <div class="row"><span class="k">节点角色</span><span class="v" id="ro">-</span></div>
  <div class="row"><span class="k">订单总数</span><span class="v" id="stats">-</span></div>

  <button onclick="refresh()">刷新（观察轮询切换节点）</button>
  <pre id="raw">…</pre>
</div>

<script>
async function refresh() {
  const out = {};
  // 1) 命中哪个节点（nginx 返回）
  try {
    const r = await fetch('/whoami', {cache:'no-store'});
    const t = (await r.text()).trim();
    out.whoami = t;
    const m = /node=([^\s]+)/.exec(t);
    document.getElementById('node').textContent = m ? m[1] : t;
    const tm = /time=([^\s]+)/.exec(t);
    document.getElementById('time').textContent = tm ? tm[1] : '-';
  } catch (e) { document.getElementById('node').textContent = 'ERR'; }

  // 2) 应用健康 + 数据库连接
  try {
    const r = await fetch('/api/../health', {cache:'no-store'});
  } catch (e) {}

  try {
    const r = await fetch('/health', {cache:'no-store'});
    const j = await r.json();
    out.health = j;
    document.getElementById('app').innerHTML = '<span class="badge">' + j.hostname + '</span>';
    const ok = j.db === 'ok';
    document.getElementById('db').innerHTML =
      '<span class="badge' + (ok?'':' bad') + '">' + j.db + '</span>';
    document.getElementById('ro').textContent = j.read_only ? '从库(只读)' : '主库(可写)';
  } catch (e) {
    document.getElementById('app').innerHTML = '<span class="badge bad">请求失败</span>';
  }

  // 3) 订单统计（用来验证主从数据一致）
  try {
    const r = await fetch('/api/stats', {cache:'no-store'});
    const j = await r.json();
    out.stats = j;
    document.getElementById('stats').textContent =
      j.total_orders !== undefined ? (j.total_orders + ' 条 (max_id=' + j.max_id + ')') : JSON.stringify(j);
  } catch (e) { document.getElementById('stats').textContent = '-'; }

  document.getElementById('raw').textContent = JSON.stringify(out, null, 2);
}
refresh();
</script>
</body>
</html>
