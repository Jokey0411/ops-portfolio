# 节点 Nginx 配置 —— node1 / node2 共用同一份
# 能共用的关键：docker-compose 里给各自网络的 app 容器配了别名 "app"

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/node_access.log main;
    error_log  /var/log/nginx/node_error.log warn;

    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # ★ 新增：应用健康检查（状态页的"应用健康/连接数据库"靠它）
    location = /health {
        proxy_pass http://app:8080/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /whoami {
        default_type text/plain;
        return 200 "node=$hostname time=$time_iso8601\n";
    }
}
