# 节点 Nginx 配置 —— node1 / node2 共用同一份
# 能共用的关键：docker-compose 里给各自网络的 app 容器配了 alias "app"
# 所以 node1-web 解析 app → node1-app，node2-web 解析 app → node2-app

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/node_access.log main;
    error_log  /var/log/nginx/node_error.log warn;

    # 标识当前节点，验证负载均衡时看这个
    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务接口反代到本节点的应用容器
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # 健康检查：给 LB 和脚本用
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 返回节点身份，用于验证轮询
    location = /whoami {
        default_type text/plain;
        return 200 "node=$hostname time=$time_iso8601\n";
    }
}
