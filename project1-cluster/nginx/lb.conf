# LB 负载均衡配置 —— 挂载到 /etc/nginx/conf.d/default.conf

# ★ 自定义访问日志格式：官方镜像默认的 main 格式**不含上游信息**，
#   出事时你只知道「返回了 200」，不知道「打到哪个节点、用了多久」。
#   07/19 那次真实用户慢请求，就是因为日志没记 upstream_response_time，
#   事后完全无法回溯到底是哪一层慢（见 docs/08 第 19 坑）。
#   四个变量各管一件事：
#     up   = 实际打到的上游地址（多节点集群里，这是唯一能证明轮询生效的东西）
#     ust  = 上游返回的状态码（空 = 根本没拿到响应，问题在连接层或后端完全没回）
#     urt  = 上游耗时（不含 nginx 自身排队时间）
#     rt   = 整个请求耗时（rt 远大于 urt 说明时间花在 nginx 自己或客户端很慢）
log_format lb_main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'up=$upstream_addr ust=$upstream_status '
                   'urt=$upstream_response_time rt=$request_time';

upstream web_cluster {
    # 开源版 Nginx 没有主动健康检查，靠 max_fails + fail_timeout 做被动摘除
    # ★ max_fails=2：连续失败 2 次才摘除
    # ★ 摘除需要多久 = max_fails × proxy_connect_timeout = 2 × 1s = 2 秒
    #   （下面 location 里的 proxy_connect_timeout 已从 3s 调到 1s）
    server node1-web:80 max_fails=2 fail_timeout=10s;
    server node2-web:80 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ★ 日志落盘到宿主机（compose 里 ./logs/nginx-lb:/var/log/nginx）。
    #   副作用：docker logs lb 只能看到 entrypoint 输出，看不到任何 nginx 日志。
    #   排查请直接看 /opt/ops/project1-cluster/logs/nginx-lb/lb_error.log
    access_log /var/log/nginx/lb_access.log lb_main;
    error_log  /var/log/nginx/lb_error.log warn;

    # 把后端节点名回传给客户端，方便肉眼验证轮询是否生效
    add_header X-Upstream-Node $upstream_addr;
    add_header X-Response-Time $upstream_response_time;

    location / {
        proxy_pass http://web_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 连接超时从 3s 调到 1s —— 这是本项目「故障切换要几秒」的唯一旋钮
        #   为什么 3s 不行：容器被 stop 之后，它在网桥上的 IP 直接消失，
        #   发过去的 SYN 不会收到 RST，而是**静默丢弃**。
        #   于是 nginx 不能靠「连接被拒」立刻发现，只能干等到 connect timeout。
        #   → 每撞一次死节点就卡满 3 秒，2 次才摘除 = 6 秒降级。
        #   同一台宿主机上的 bridge 网络，RTT < 1ms，1 秒已经是极其宽松的上限。
        proxy_connect_timeout 1s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # 后端 5xx / 超时时自动重试下一个节点
        # ★ 这一条是「切换期间客户端仍拿到 200」的关键：
        #   node1 卡住 → 立刻重试 node2 → 用户只感觉到「慢」，不感觉到「错」
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        # ★ tries=2 = 最多试 2 个节点。集群只有 2 个节点，这个值刚好；
        #   如果节点扩到 3 个以上，这里要同步调大，否则第 3 个节点永远轮不到
        proxy_next_upstream_tries 2;
    }

    location /lb-health {
        access_log off;
        return 200 "lb ok\n";
    }
}

# 状态页，仅本机可访问（8400 端口已在防火墙放通，生产建议只放行内网）
server {
    listen 8400;
    server_name _;
    allow 127.0.0.1;
    allow 172.20.0.0/24;
    deny all;

    location /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        return 200 "node: lb\n";
    }
}
