# LB 负载均衡配置 —— 挂载到 /etc/nginx/conf.d/default.conf

upstream web_cluster {
    # 开源版 Nginx 没有主动健康检查，靠 max_fails + fail_timeout 做被动摘除
    server node1-web:80 max_fails=2 fail_timeout=10s;
    server node2-web:80 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/lb_access.log main;
    error_log  /var/log/nginx/lb_error.log warn;

    # 把后端节点名回传给客户端，方便肉眼验证轮询是否生效
    add_header X-Upstream-Node $upstream_addr;
    add_header X-Response-Time $upstream_response_time;

    location / {
        proxy_pass http://web_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生产要设的超时，不设的话后端挂了连接会一直挂着
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # 后端 5xx / 超时时自动重试下一个节点
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /lb-health {
        access_log off;
        return 200 "lb ok\n";
    }
}

# 状态页，仅本机可访问（8400 端口已在防火墙放通，生产建议只放行内网）
server {
    listen 8400;
    server_name _;
    allow 127.0.0.1;
    allow 172.20.0.0/24;
    deny all;

    location /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        return 200 "node: lb\n";
    }
}
