; PHP 运行时配置 —— 挂载到 /usr/local/etc/php/conf.d/zz-custom.ini

memory_limit       = 128M
max_execution_time = 30
upload_max_filesize = 16M
post_max_size      = 18M
date.timezone      = Asia/Shanghai
display_errors     = On          ; 测试环境开启，生产必须 Off
error_reporting    = E_ALL
log_errors         = On
error_log          = /proc/self/fd/2

; OPcache（PHP 性能最划算的优化，不开性能差 3~5 倍）
opcache.enable              = 1
opcache.memory_consumption  = 64      ; 2G 机器给 64M 足够
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1       ; 测试环境开，改代码立即生效；生产建议 0
opcache.revalidate_freq     = 2
opcache.save_comments       = 1

; MySQL 长连接相关
mysqli.allow_persistent = Off
