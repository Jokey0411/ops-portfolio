# =============================================================
#  项目二：基于 Docker Compose 的 LNMP 环境
#  Nginx + PHP-FPM + MySQL 8.0，自定义网络 + 数据卷
#
#  端口：宿主机 8080（80 被项目一的 LB 占用；生产环境分时切换）
# =============================================================

name: lnmp-p2

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lnmp-nginx
    hostname: lnmp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www/html:rw
      - ./logs/nginx:/var/log/nginx
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.10
    depends_on:
      php: { condition: service_started }

  php:
    build: ./php
    container_name: lnmp-php
    hostname: lnmp-php
    volumes:
      - ./www:/var/www/html:rw
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      DB_HOST: "mysql"
      DB_NAME: "shop"
      DB_USER: "app"
      DB_PASS: "App@123456"
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.11
    depends_on:
      mysql: { condition: service_healthy }

  mysql:
    image: mysql:8.0
    container_name: lnmp-mysql
    hostname: lnmp-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: "Root@123456"
      MYSQL_DATABASE: "shop"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "App@123456"
      TZ: "Asia/Shanghai"
    volumes:
      # 数据卷：named volume，容器删除后数据仍在
      - mysql-data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./logs/mysql:/var/log/mysql
    # 端口不映射到宿主机：数据库只对本网络内的 php 暴露
    expose:
      - "3306"
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 可选：Redis 缓存（约 8MB 内存，2G 机器可开，默认注释）----
  # redis:
  #   image: redis:7-alpine
  #   container_name: lnmp-redis
  #   command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  #   networks:
  #     lnmp-net:
  #       ipv4_address: 172.30.0.13

networks:
  lnmp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  mysql-data:
    name: lnmp_p2_mysql_data
