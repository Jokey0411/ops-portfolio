# =============================================================
#  项目二：基于 Docker Compose 的 LNMP 环境
#  Nginx + PHP-FPM + MySQL 8.0，自定义网络 + 数据卷
#
#  端口：宿主机 8080（80 被项目一的 LB 占用；生产环境分时切换）
# =============================================================

name: lnmp-p2

# =============================================================
#  日志上限：所有服务统一走 json-file 轮转
#  ★ 为什么写在 compose 里而不用 /etc/docker/daemon.json？
#    daemon.json 是「宿主机默认值」，只对**之后新建**的容器生效，
#    换台机器、重装 docker 就丢了，而且不会进 git 评审。
#    compose 里的 logging 是「服务的属性」，跟着代码走，谁 clone 都一样。
#  ★ 10m × 3 = 单容器日志最多占 30MB，四个容器封顶 120MB。
#    不设上限时 json-file 会一直追加，是 2C2G/40G 小机器被写满的常见原因。
# =============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lnmp-nginx
    hostname: lnmp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www/html:rw
      - ./logs/nginx:/var/log/nginx
    logging: *default-logging
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.10
    depends_on:
      php: { condition: service_started }

  php:
    build: ./php
    container_name: lnmp-php
    hostname: lnmp-php
    volumes:
      - ./www:/var/www/html:rw
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      DB_HOST: "mysql"
      DB_NAME: "shop"
      DB_USER: "app"
      DB_PASS: "App@123456"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    logging: *default-logging
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.11
    depends_on:
      mysql: { condition: service_healthy }
      # 用 service_healthy 而不是 service_started：
      # Redis 启动到能接受命令有几毫秒空窗，php 早起来会在首批请求上连接失败
      redis: { condition: service_healthy }

  mysql:
    image: mysql:8.0
    container_name: lnmp-mysql
    hostname: lnmp-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: "Root@123456"
      MYSQL_DATABASE: "shop"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "App@123456"
      TZ: "Asia/Shanghai"
    volumes:
      # 数据卷：named volume，容器删除后数据仍在
      - mysql-data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./logs/mysql:/var/log/mysql
    # 端口不映射到宿主机：数据库只对本网络内的 php 暴露
    expose:
      - "3306"
    logging: *default-logging
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- Redis：缓存 + PHP session 共享 ----
  # 为什么两个用途都要：缓存是「性能」，session 是「有状态服务容器化」。
  # PHP-FPM 默认把 session 写本地文件，一旦 php 扩到多个副本，
  # 用户的会话就散落在各自容器里 → 必须做会话粘滞，等于无法水平扩容。
  redis:
    image: redis:7-alpine
    container_name: lnmp-redis
    hostname: lnmp-redis
    # ★ --save "" 关闭 RDB 快照：缓存丢了可以回源重建，不需要持久化。
    #   开着快照会让 Redis 定期 fork，2G 机器上 fork 的写时复制会吞内存。
    # ★ maxmemory + allkeys-lru：内存到顶后淘汰最久未用的 key，
    #   不会像不设限那样把 2G 机器吃光（Docker 的 mem_limit 会直接 OOM Kill）。
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 96m
    restart: unless-stopped
    logging: *default-logging
    networks:
      lnmp-net:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  lnmp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  mysql-data:
    name: lnmp_p2_mysql_data
