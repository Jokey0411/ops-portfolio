server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/lnmp_access.log main;
    error_log  /var/log/nginx/lnmp_error.log warn;

    client_max_body_size 16m;

    # 记录真实耗时，方便定位慢请求
    log_format main_ext '$remote_addr - [$time_local] "$request" '
                        '$status rt=$request_time urt=$upstream_response_time '
                        'body=$body_bytes_sent';
    access_log /var/log/nginx/lnmp_access.log main_ext;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 静态资源：不走 PHP，直接返回
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        # ★ fastcgi_pass 用服务名 php，靠 Docker 内嵌 DNS 解析
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;

        # 超时设置（不设的话 PHP 卡死会一直挂着）
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    30s;
        fastcgi_read_timeout    30s;
        fastcgi_buffering       on;
    }

    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
    }

    location ~ /\.ht { deny all; }
}
