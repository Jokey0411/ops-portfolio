# =============================================================
#  ★ log_format 只能出现在 http 上下文，不能写进 server{}
#
#  为什么写在「文件顶层」反而对：
#    nginx.conf 的结构是  http { ... include conf.d/*.conf; ... }
#    所以 conf.d 里的文件是被展开在 http{} 内部的，
#    文件顶层 = http 上下文 → log_format 合法
#    写进 server{}  → 上下文降级 → 报
#        [emerg] "log_format" directive is not allowed here
#    容器退出码 1，docker compose ps 显示 Exited (1)
# =============================================================
log_format main_ext '$remote_addr - [$time_local] "$request" '
                    '$status rt=$request_time urt=$upstream_response_time '
                    'body=$body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/lnmp_access.log main_ext;
    error_log  /var/log/nginx/lnmp_error.log warn;

    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 静态资源：不走 PHP，直接返回
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        # ★ fastcgi_pass 用服务名 php，靠 Docker 内嵌 DNS 解析
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;

        # 超时设置（不设的话 PHP 卡死会一直挂着）
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    30s;
        fastcgi_read_timeout    30s;
        fastcgi_buffering       on;
    }

    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
    }

    location ~ /\.ht { deny all; }
}
