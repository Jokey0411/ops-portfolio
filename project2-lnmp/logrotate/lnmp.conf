# =============================================================
#  LNMP 容器「文件日志」轮转
#  部署：cp 本文件 /etc/logrotate.d/lnmp && chmod 644 /etc/logrotate.d/lnmp
#  检查：logrotate -d /etc/logrotate.d/lnmp      # -d 只演练不执行
#        logrotate -f /etc/logrotate.d/lnmp      # 强制立刻转一次
#
#  ★ 为什么需要这个文件：
#    docker 的 max-size/max-file 只管容器的 stdout/stderr（json-file 驱动）。
#    而下面这些日志是应用自己写进**挂载目录**的普通文件，
#    在 docker 眼里它们只是宿主机上的普通文件 —— 永远不会轮转、永远在涨。
#    「日志上限」只配 docker 那一半，等于只锁了前门。
# =============================================================

# ---------------- nginx：access.log 每请求一行，涨得最快 ----------------
/opt/ops/project2-lnmp/logs/nginx/*.log {
    daily
    maxsize 20M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    # nginx 收到 USR1 会「重新打开日志文件」，连接不断、日志不丢。
    # 邮件里常写的 kill -USR1 $(cat /run/nginx.pid) 在宿主机上拿不到容器内的 pid，
    # 用 docker kill 直接给容器内 PID 1 发信号，效果一样。
    postrotate
        /usr/bin/docker kill --signal=USR1 lnmp-nginx >/dev/null 2>&1 || true
    endscript
}

# ---------------- mysql：slow.log / error.log ----------------
/opt/ops/project2-lnmp/logs/mysql/*.log {
    daily
    maxsize 50M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    # mysqld 没有「重新打开日志」的信号，只能用 copytruncate：
    # 先复制一份，再把原文件截断成 0 字节 —— mysqld 持有的 fd 不变，继续往后写。
    # 代价是复制和截断之间的几毫秒里写入的日志会丢，演练环境可接受。
    # 如果换成 rename + create，mysqld 会一直写那个已被改名的旧文件，
    # 新的 slow.log 会永远是空的 —— 这是最典型的「轮转配了但没生效」。
    copytruncate
    su root root
}
